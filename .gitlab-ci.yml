# GitLab CI/CD Pipeline for Frappe Application
# This pipeline builds Docker images and deploys to VM using Docker Compose

default:
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_DRIVER: overlay2
  DOCKER_BUILDKIT: 1
  BUILD_PROJECT_ID: "74633412"

stages:
  - build
  - deploy

trigger_build:
  stage: build
  image: alpine:latest
  tags:
    - ubuntu-shared
  before_script:
    - apk add --no-cache curl
  rules:
    # Trigger on main branch commits
    - if: $CI_COMMIT_BRANCH == "main"
    # Or trigger on merge requests if needed
    - if: $CI_MERGE_REQUEST_ID
      when: manual
    # Manual trigger option
    - when: manual
      allow_failure: false
  script:
    - |
      echo "Triggering central repository build..."
      echo "Project ID: ${BUILD_PROJECT_ID}"
      echo "Triggered by: ${CI_PROJECT_NAME}"
      echo "Commit SHA: ${CI_COMMIT_SHA}"
      echo "Branch: ${CI_COMMIT_REF_NAME}"

      RESPONSE=$(curl -X POST \
        --form "token=${BUILD_PROJECT_TRIGGER_TOKEN}" \
        --form "ref=main" \
        --form "variables[TRIGGERED_BY_APP]=${CI_PROJECT_NAME}" \
        --form "variables[APP_COMMIT_SHA]=${CI_COMMIT_SHA}" \
        --form "variables[APP_BRANCH]=${CI_COMMIT_REF_NAME}" \
        -w "\nHTTP_STATUS:%{http_code}" \
        "https://gitlab.com/api/v4/projects/${BUILD_PROJECT_ID}/trigger/pipeline")

      echo "Response: $RESPONSE"

      # Extract HTTP status code
      HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
      echo "HTTP Status: $HTTP_STATUS"

      if [ "$HTTP_STATUS" -eq 201 ]; then
        echo "✓ Central repository build triggered successfully"
      else
        echo "✗ Failed to trigger build. HTTP Status: $HTTP_STATUS"
        echo "Response: $RESPONSE"
        exit 1
      fi

      echo "Triggering frappe cloud deployment"

      RESPONSE=$(curl -X POST \
        --form "token=${BUILD_PROJECT_TRIGGER_TOKEN}" \
        --form "ref=feat-frappe-cloud-deployment" \
        --form "variables[TRIGGERED_BY_APP]=${CI_PROJECT_NAME}" \
        --form "variables[APP_COMMIT_SHA]=${CI_COMMIT_SHA}" \
        --form "variables[APP_BRANCH]=${CI_COMMIT_REF_NAME}" \
        -w "\nHTTP_STATUS:%{http_code}" \
        "https://gitlab.com/api/v4/projects/${BUILD_PROJECT_ID}/trigger/pipeline")

      echo "Response: $RESPONSE"

      # Extract HTTP status code
      HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
      echo "HTTP Status: $HTTP_STATUS"

      if [ "$HTTP_STATUS" -eq 201 ]; then
        echo "✓ Frappe Cloud deployment pipeline triggered successfully"
      else
        echo "✗ Failed to trigger Frappe Cloud deployment pipeline"
        echo "Response: $RESPONSE"
        exit 1
      fi

